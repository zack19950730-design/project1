<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資產計算器主頁</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.bundle.js"></script>
</head>
<body>
<div class="container mt-4">
    
    <h1 class="display-5 fw-bold mb-4">
        <div class="row align-items-center">
            <div class="col-3">淨資產:</div>
            <div class="col-3"></div>
            <div class="col-5 text-success" id="netWorth">0</div>
        </div>
    </h1>
    
    <hr class="my-4">

    <div class="row fs-4 my-3 align-items-center">
        <div class="col-3">
            <a href="cash01.html" class="text-decoration-none text-primary fw-semibold">流動資金:</a>
        </div>
        <div class="col-3 text-muted fs-6">(台幣、美金)</div>
        <div class="col-3 fw-bold text-end" id="cashAmount">0</div>
        <div class="col-3 text-muted fs-6">(台幣)</div>
    </div>

    <div class="row fs-4 my-3 align-items-center">
        <div class="col-3">
            <a href="stock01.html" class="text-decoration-none text-primary fw-semibold">投資:</a>
        </div>
        <div class="col-3 text-muted fs-6">(台股、美股)</div>
        <div class="col-3 fw-bold text-end" id="investmentAmount">0</div>
        <div class="col-3 text-muted fs-6">(台幣)</div>
    </div>

    <div class="row fs-4 my-3 align-items-center">
        <div class="col-3 class="fw-semibold"">固定資產:</div>
        <div class="col-3 text-muted fs-6">(房產、汽車)</div>
        <div class="col-3 fw-bold text-end" id="fixedAssetAmount">109,474</div>
        <div class="col-3 text-muted fs-6">(台幣)</div>
    </div>

</div>

<script>
// 建立一個從「共用筆記本」讀取資料並計算的函式
function calculateNetWorth() {
    // 【步驟一：讀取資料】從 localStorage 拿出分頁存進去的數字，拿不到就預設為 0
    const cash = parseFloat(localStorage.getItem('totalCash')) || 0;
    const investment = parseFloat(localStorage.getItem('totalInvestment')) || 0;
    
    // 讀取固定資產畫面上的字串，並把千分位逗號去掉轉回純數字
    const fixedAssetRaw = document.getElementById('fixedAssetAmount').innerText.replace(/,/g, '');
    const fixedAsset = parseFloat(fixedAssetRaw) || 0;

    // 【步驟二：填入分項空格】渲染流動資金與投資金額，並加上專業的千分位逗號
    document.getElementById('cashAmount').innerText = Math.round(cash).toLocaleString();
    document.getElementById('investmentAmount').innerText = Math.round(investment).toLocaleString();

    // 【步驟三：最終加總】將三者相加，並渲染到最上方的「淨資產」欄位
    const totalNetWorth = cash + investment + fixedAsset;
    document.getElementById('netWorth').innerText = Math.round(totalNetWorth).toLocaleString();
}

// 當主網頁載入完成時，立刻執行一次計算
window.addEventListener('DOMContentLoaded', calculateNetWorth);

// 【進階優化功能】：監聽瀏覽器儲存空間變化
// 當您開著主頁，同時在別的分頁（如股票頁）重新整理獲取新股價時，主頁會「完全免整理」即時跳動更新！
window.addEventListener('storage', calculateNetWorth);
</script>
</body>
</html>
