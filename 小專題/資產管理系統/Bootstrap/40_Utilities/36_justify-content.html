<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify-content</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.bundle.js"></script>
</head>

<body>

    <div class="container">

        <h4>官方網站</h4>
        <p><a
                href="https://getbootstrap.com/docs/5.3/utilities/flex/#justify-content">https://getbootstrap.com/docs/5.3/utilities/flex/#justify-content</a>
        </p>
        <h4>Bootstrap Flex - Responsive Flex Classes (在最底下)</h4>
        <p><a
                href="https://www.w3schools.com/bootstrap5/bootstrap_flex.php">https://www.w3schools.com/bootstrap5/bootstrap_flex.php</a>
        </p>
        <hr>
        <h3>.flex-colum</h3>
        <div class="d-flex flex-column p-3 bg-secondary">
            <div class="p-2 bg-info"></div>
            <div class="p-2 bg-success"></div>
            <div class="p-2 bg-warning"></div>
        </div>
        <!-- ** 請比較下列四種class ** -->

        <!-- 10. .justify-content-* -->
        <hr>
        <h3>.justify-content</h3>
        <div class="d-flex justify-content-center p-3 bg-secondary">
            <div class="p-2 bg-info"></div>
            <div class="p-2 bg-success"></div>
            <div class="p-2 bg-warning"></div>
        </div>


        <!-- 20. .align-items-* -->
        <hr>
        <h3>.align-item</h3>
        <div class="d-flex align-items-center p-3 bg-secondary" style="height: 300px;">
            <div class="p-2 bg-info"></div>
            <div class="p-2 bg-success"></div>
            <div class="p-2 bg-warning"></div>
        </div>


        <!-- 21. .align-self-* -->
        <hr>
        <h3>.align-self</h3>
        <div class="d-flex align-self-center p-3 bg-secondary" style="height: 300px;">
            <div class="p-2 bg-info">a</div>
            <div class="align-self-center p-2 bg-success">b</div>
            <div class="p-2 bg-warning">c</div>


            <!-- 22. .align-content-*  -->
            <hr>
            <h3>.align-content</h3>
            <div class="d-flex align-content-center p-3 bg-secondary" style="height: 300px;">
                <div class="p-2 bg-info"></div>
                <div class="p-2 bg-success"></div>
                <div class="p-2 bg-warning"></div>
                <div class="p-2 bg-info"></div>
                <div class="p-2 bg-success"></div>
                <div class="p-2 bg-warning"></div>
                <div class="p-2 bg-info"></div>
                <div class="p-2 bg-success"></div>
                <div class="p-2 bg-warning"></div>
                <div class="p-2 bg-info"></div>
                <div class="p-2 bg-success"></div>
                <div class="p-2 bg-warning"></div>



            </div>

</body>

</html>
