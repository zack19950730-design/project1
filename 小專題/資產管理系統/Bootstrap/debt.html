<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>負債明細</title>
    <!-- 如果本機沒有 Bootstrap，可以直接開啟下方的 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-4">
        <h1>
            <div class="row">
                <div class="col-4">負債:</div>
                <div class="col-4"></div>
                <div class="col-4" id="totalX">0</div> 
            </div>
        </h1>

        <div class="row mt-4 mb-4">
            <div class="col-12">
                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle" type="button" id="addAssetDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        + 新增項目
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="addAssetDropdown">
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="handleAsset('房貸')">房貸</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="handleAsset('車貸')">車貸</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)" onclick="handleAsset('信貸')">信貸</a></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="handleAssetCustom()">其他</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="asset-list-container">
            <!-- 房子 -->
            <div class="asset-item" data-name="房貸" data-currency="TWD">
                <div class="row">
                    <div class="col-4 font-label">房貸:</div>
                    <div class="col-4"></div>
                    <div class="col-4 value-field" id="valueX1">0</div>
                </div>
                <div class="row text-muted mb-3" style="font-size: 0.9rem;">
                    <div class="col-4"></div>
                    <div class="col-4"></div>
                    <div class="col-4">(台幣)</div>
                </div>
            </div>

            <!-- 車子 (修正：把 data-currency 改回 TWD) -->
            <div class="asset-item" data-name="車貸" data-currency="TWD">
                <div class="row">
                    <div class="col-4 font-label">車貸:</div>
                    <div class="col-4"></div>
                    <div class="col-4 value-field" id="valueX2">0</div>
                </div>
                <div class="row text-muted mb-3" style="font-size: 0.9rem;">
                    <div class="col-4"></div>
                    <div class="col-4"></div>
                    <div class="col-4">(台幣)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 處理資產 新增/修改 的函數
        function handleAsset(itemName) {
            let inputAmount = prompt(`請輸入「${itemName}」的金額：`);
            
            if (inputAmount === null || inputAmount.trim() === "") {
                return;
            }

            let amount = parseInt(inputAmount) || 0;
            let existingItem = document.querySelector(`.asset-item[data-name="${itemName}"]`);

            if (existingItem) {
                let valueField = existingItem.querySelector('.value-field');
                valueField.innerText = amount;
            } else {
                let container = document.getElementById('asset-list-container');
                let newId = 'valueX_' + Date.now();

                // 固定資產通常為台幣，這裡直接預設台幣格式
                let newItemHTML = `
                    <div class="asset-item" data-name="${itemName}" data-currency="TWD">
                        <div class="row">
                            <div class="col-4 font-label">${itemName}:</div>
                            <div class="col-4"></div>
                            <div class="col-4 value-field" id="${newId}">${amount}</div>
                        </div>
                        <div class="row text-muted mb-3" style="font-size: 0.9rem;">
                            <div class="col-4"></div>
                            <div class="col-4"></div>
                            <div class="col-4">(台幣)</div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', newItemHTML);
            }

            calculateTotal();
        }

        function handleAssetCustom() {
            let customName = prompt("請輸入自訂項目的名稱（例如：未收款）：");
            if (customName && customName.trim() !== "") {
                handleAsset(customName.trim());
            }
        }

        // 計算與千分位格式化函數
        function calculateTotal() {
            let total = 0;
            
            let valueFields = document.querySelectorAll('.value-field');
            
            valueFields.forEach(function(element) {
                let rawText = element.innerText.replace(/,/g, '');
                let val = parseInt(rawText) || 0;
                
                // ★ 關鍵修復：你原本漏掉了這一行，這行負責把數值加進總和裡面
                total += val; 
                
                element.innerText = val.toLocaleString();
            });

            // 更新總和的顯示
            document.getElementById('totalX').innerText = total.toLocaleString();
        }

        window.onload = calculateTotal;
    </script>
</body>

</html>
