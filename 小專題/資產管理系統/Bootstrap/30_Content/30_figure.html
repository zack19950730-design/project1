<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.bundle.js"></script>

</head>

<body>
    <div class="container">

        <h4>官方網站</h4>
        <p><a
                href="https://getbootstrap.com/docs/5.3/content/figures/">https://getbootstrap.com/docs/5.3/content/figures/</a>
        </p>
        <hr>

        <!-- 10. 練習套用 .figure  .figure-img  以及 .figure-caption  等三個類別   -->
        <figure class="figure">
            <img src="../image/sunny.jpg" alt="" class="img-fluid">
            <figcaption>sunny</figcaption>

        </figure>
        <!-- 20. 請試著將畫面分成三等分，個別放入一組步驟10完成的項目 -->



        <div class="row">
            <div class="col-4">
                <img src="../image/sunny.jpg" alt="" class="img-fluid">
            <figcaption>sunny</figcaption>
            </div>
            <div class="col-4">
                <img src="../image/sunny.jpg" alt="" class="img-fluid">
            <figcaption>sunny</figcaption>
            </div>
            <div class="col-4">
                <img src="../image/sunny.jpg" alt="" class="img-fluid">
            <figcaption>sunny</figcaption>
            </div>
            
        </div>
    </div>
</body>

</html>
