<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <title>個人投資看板 (CORS 擴充功能版)</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
  <h2>投資總額: <span id="totalInvestment" class="text-primary fw-bold">連線中...</span></h2>
  
  <h4 class="mt-4">台股資產</h4>
  <table class="table mt-2">
    <thead class="table-dark">
      <tr><th>台股 (代號)</th><th>股數</th><th>現價 (元/股)</th><th>總金額 (台幣)</th></tr>
    </thead>
    <tbody id="twStockBody">
      <tr data-code="2330" data-shares="200"><td>台積電 (2330)</td><td>200</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
      <tr data-code="2308" data-shares="300"><td>台達電 (2308)</td><td>300</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
      <tr data-code="3037" data-shares="500"><td>欣興 (3037)</td><td>500</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
    </tbody>
  </table>

  <h4 class="mt-4">美股資產 (匯率: 1 USD = 31 TWD)</h4>
  <table class="table mt-2">
    <thead class="table-dark">
      <tr><th>美股 (代號)</th><th>股數</th><th>現價 (元/股)</th><th>總金額 (美金)</th></tr>
    </thead>
    <tbody id="usStockBody">
      <tr data-code="NBIS" data-shares="127"><td>NBIS</td><td>127</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
      <tr data-code="INTC" data-shares="229"><td>INTEL (INTC)</td><td>229</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
      <tr data-code="PLTR" data-shares="58"><td>PLTR</td><td>58</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
      <tr data-code="TXN" data-shares="58"><td>TXN</td><td>58</td><td class="price">讀取中...</td><td class="amount">-</td></tr>
    </tbody>
  </table>
</div>

<script>
const USD_TO_TWD = 31;

// 啟用瀏覽器擴充功能後，可以直接無阻礙呼叫 Yahoo Finance
async function getLivePrice(symbol) {
  try {
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`);
    const data = await res.json();
    return data.chart.result[0].meta.regularMarketPrice || 0;
  } catch (e) {
    console.error("讀取失敗，請確認是否已開啟 Allow-CORS 擴充功能", e);
    return 0;
  }
}

async function calculate() {
  let totalTWD = 0;

  // 台股 (Yahoo 代號需加 .TW)
  for (let row of document.querySelectorAll("#twStockBody tr")) {
    const code = row.getAttribute("data-code");
    const shares = parseFloat(row.getAttribute("data-shares"));
    const price = await getLivePrice(`${code}.TW`);
    const amount = shares * price;
    totalTWD += amount;
    row.querySelector(".price").innerText = price > 0 ? `$${price.toFixed(2)}` : "需開啟擴充功能";
    row.querySelector(".amount").innerText = price > 0 ? `$${Math.round(amount).toLocaleString()}` : "-";
  }

  // 美股
  for (let row of document.querySelectorAll("#usStockBody tr")) {
    const code = row.getAttribute("data-code");
    const shares = parseFloat(row.getAttribute("data-shares"));
    const price = await getLivePrice(code);
    const amountUSD = shares * price;
    totalTWD += (amountUSD * USD_TO_TWD);
    row.querySelector(".price").innerText = price > 0 ? `$${price.toFixed(2)}` : "需開啟擴充功能";
    row.querySelector(".amount").innerText = price > 0 ? `$${Math.round(amountUSD).toLocaleString()}` : "-";
  }

  if(totalTWD > 0) {
    document.getElementById("totalInvestment").innerText = `NT$ ${Math.round(totalTWD).toLocaleString()}`;
  }
}

window.addEventListener("DOMContentLoaded", calculate);
function saveInvestmentData() {
    // 1. 抓取欄位文字（改用 textContent 並加上 trim 去除前後空白）
    const element = document.getElementById("totalInvestment") || document.querySelector(".text-primary.fw-bold");
    
    if (element) {
        const rawText = element.textContent.trim(); 
        console.log("A網頁實際抓到的原始文字為:", rawText); // 供你偵錯看
        
        // 2. 清洗資料：只留下數字與小數點
        const cleanText = rawText.replace(/[^0-9.]/g, "");
        
        // 3. 轉換成數字（如果空字串就給 0）
        const numericValue = parseFloat(cleanText) || 0;
        
        // 4. 準備要儲存的資料
        const today = new Date().toISOString().split('T')[0];
        const dataToSave = {
            amount: numericValue, // 這裡現在絕對會是正常的數字了！
            date: today
        };
        
        // 5. 存入 localStorage
        localStorage.setItem("dailyInvestment", JSON.stringify(dataToSave));
        console.log("資料已成功存入 localStorage:", dataToSave);
    } else {
        console.error("A網頁找不到該投資欄位");
    }
}


// 網頁載入完成後自動執行
window.addEventListener("DOMContentLoaded", saveInvestmentData);
</script>
</body>
</html>
