<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票交易紀錄</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-image: url(./image/images.png);
            background-repeat: repeat;
            background-size: 20%;
            font-family: sans-serif;
            background-attachment: fixed;
            color: rgb(0, 0, 0);
        }

        .section-container {
            background: rgba(255, 255, 255, 0.95);
            position: relative;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            z-index: 1;
        }

        .bg-buy {
            background-color: #ffe6e6 !important;
            color: #cc0000;
        }

        .bg-sell {
            background-color: #e6ffe6 !important;
            color: #008000;
        }
    </style>
</head>

<body>

  

    <div class="container section-container mb-5">
        <h2>股票交易紀錄
        </h2>

        <div class="row mt-4 mb-3">
            <div class="col-12">
                <button class="btn btn-success me-2" onclick="openAddModal('TW')">+ 新增台股交易</button>
                <button class="btn btn-primary" onclick="openAddModal('US')">+ 新增美股交易</button>
            </div>
        </div>

        <h4 class="mt-4">台股交易紀錄</h4>
        <table class="table table-hover mt-2">
            <thead class="table-dark">
                <tr>
                    <th>日期</th>
                    <th>買/賣</th>
                    <th>代號</th>
                    <th>股數</th>
                    <th>現價</th>
                    <th>總金額 (台幣)</th>
                </tr>
            </thead>
            <tbody id="twStockBody">
                <tr data-code="2330" data-shares="200">
                    <td>2026/04/12</td>
                    <td class="buysale">買</td>
                    <td>2330</td>
                    <td>200</td>
                    <td class="price">4500</td>
                    <td class="amount">900,000</td>
                </tr>
                <tr data-code="3037" data-shares="200">
                    <td>2026/04/12</td>
                    <td class="buysale">買</td>
                    <td>3037</td>
                    <td>200</td>
                    <td class="price">20</td>
                    <td class="amount">400</td>
                </tr>
                <tr data-code="2308" data-shares="200">
                    <td>2026/04/12</td>
                    <td class="buysale">賣</td>
                    <td>2308</td>
                    <td>200</td>
                    <td class="price">31</td>
                    <td class="amount">6200</td>
                </tr>
            </tbody>
        </table>

        <h4 class="mt-4">美股交易紀錄 (匯率: 1 USD = 31 TWD)</h4>
        <table class="table table-hover mt-2">
            <thead class="table-dark">
                <tr>
                    <th>日期</th>
                    <th>買/賣</th>
                    <th>代號</th>
                    <th>股數</th>
                    <th>現價</th>
                    <th>總金額 (美金)</th>
                </tr>
            </thead>
            <tbody id="usStockBody">
                <tr data-code="INTC" data-shares="50">
                    <td>2026/04/12</td>
                    <td class="buysale">買</td>
                    <td>INTC</td>
                    <td>50</td>
                    <td class="price">2100</td>
                    <td class="amount">1200</td>
                </tr>
                <tr data-code="NBIS" data-shares="50">
                    <td>2026/04/12</td>
                    <td class="buysale">賣</td>
                    <td>NBIS</td>
                    <td>50</td>
                    <td class="price">150</td>
                    <td class="amount">7500</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Bootstrap 彈出式對話框 (Modal) -->
    <div class="modal fade" id="addStockModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">新增股票交易</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="stockForm">
                        <input type="hidden" id="stockType"> <!-- 紀錄是台股還是美股 -->
                        <div class="mb-3">
                            <label for="tradeDate" class="form-label">日期</label>
                            <input type="date" class="form-control" id="tradeDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="tradeType" class="form-label">買/賣</label>
                            <select class="form-select" id="tradeType" required>
                                <option value="買">買</option>
                                <option value="賣">賣</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="stockCode" class="form-label">股票代號</label>
                            <input type="text" class="form-control" id="stockCode" placeholder="例如: 2330 或 AAPL" required>
                        </div>
                        <div class="mb-3">
                            <label for="stockShares" class="form-label">股數</label>
                            <input type="number" class="form-control" id="stockShares" placeholder="100" min="1" oninput="calculateTotal()" required>
                        </div>
                        <div class="mb-3">
                            <label for="stockPrice" class="form-label">現價 (單價)</label>
                            <input type="number" class="form-control" id="stockPrice" placeholder="500" step="0.01" min="0" oninput="calculateTotal()" required>
                        </div>
                        <div class="mb-3">
                            <label for="stockTotal" class="form-label">預估總金額</label>
                            <input type="text" class="form-control" id="stockTotal" readonly placeholder="自動計算">
                        </div>
                        <div class="modal-footer pe-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                            <button type="submit" class="btn btn-primary">儲存資料</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Bootstrap Modal
        let stockModal;
        document.addEventListener("DOMContentLoaded", () => {
            stockModal = new bootstrap.Modal(document.getElementById('addStockModal'));
            updateRowColors(); // 初始化既有表格顏色
        });

        // 打開表單時觸發
        function openAddModal(type) {
            document.getElementById('stockType').value = type;
            document.getElementById('modalTitle').textContent = type === 'TW' ? '新增台股交易紀錄' : '新增美股交易紀錄';
            
            // 重置表單並帶入今日日期
            document.getElementById('stockForm').reset();
            document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('stockTotal').value = '';

            stockModal.show();
        }

        // 自動計算總金額 (股數 x 現價)
        function calculateTotal() {
            const shares = parseFloat(document.getElementById('stockShares').value) || 0;
            const price = parseFloat(document.getElementById('stockPrice').value) || 0;
            const total = shares * price;
            
            document.getElementById('stockTotal').value = total > 0 ? total.toLocaleString('zh-TW') : '';
        }

        // 提交表單新增至表格
        document.getElementById('stockForm').addEventListener('submit', function (e) {
            e.preventDefault(); // 阻止網頁重新整理

            const type = document.getElementById('stockType').value;
            const dateStr = document.getElementById('tradeDate').value.replace(/-/g, '/');
            const tradeType = document.getElementById('tradeType').value;
            const code = document.getElementById('stockCode').value.trim().toUpperCase();
            const shares = parseFloat(document.getElementById('stockShares').value);
            const price = parseFloat(document.getElementById('stockPrice').value);
            const totalAmount = (shares * price).toLocaleString('zh-TW');

            // 建立新的 <tr> 節點
            const tr = document.createElement('tr');
            tr.setAttribute('data-code', code);
            tr.setAttribute('data-shares', shares);

            tr.innerHTML = `
                <td>${dateStr}</td>
                <td class="buysale">${tradeType}</td>
                <td>${code}</td>
                <td>${shares}</td>
                <td class="price">${price}</td>
                <td class="amount">${totalAmount}</td>
            `;

            // 根據類型加到台股或美股的 tbody
            const targetBodyId = type === 'TW' ? 'twStockBody' : 'usStockBody';
            document.getElementById(targetBodyId).appendChild(tr);

            // 更新新整列的底色
            applyRowColor(tr, tradeType);

            // 關閉模態框
            stockModal.hide();
        });

        // 變色邏輯封裝
        function applyRowColor(trRow, text) {
            trRow.classList.remove('table-danger', 'table-success');
            if (text === '買') {
                trRow.classList.add('table-danger');
            } else if (text === '賣') {
                trRow.classList.add('table-success');
            }
        }

        // 全域更新底色
        function updateRowColors() {
            const buySaleCells = document.querySelectorAll('.buysale');
            buySaleCells.forEach(cell => {
                const text = cell.textContent.trim();
                const trRow = cell.closest('tr');
                applyRowColor(trRow, text);
            });
        }
    </script>
</body>

</html>
