spring.application.name=asset-system-backend
server.port=8080

# ---------- 資料庫 (XAMPP MySQL / MariaDB) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/asset_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei
spring.datasource.username=root
spring.datasource.password=

# 資料表由 database/schema.sql 建立，JPA 不自動改表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- 系統設定 ----------
# 美金匯率 (1 USD = ? TWD)
app.usd-rate=31
# 股價快取秒數，避免頻繁打 Yahoo API
app.price-cache-seconds=60
# 允許的前端來源 (Vite 開發伺服器)
app.cors-origins=http://localhost:5173
